- name: Build (unsigned, device)
        run: |
          set -o pipefail
          echo "EXTRA_SWIFT_FLAGS=$EXTRA_SWIFT_FLAGS"
          
          # 使用更稳妥的编译模式，直接用无优化/安全模式绕过 Xcode 26 的 IRGen/SIL 编译器崩溃 Bug
          build_with() {
            local name="$1" mode="$2" opt="$3" extra_flags="$4"
            echo "----- 尝试组合: $name (mode=$mode opt=$opt) -----"
            xcodebuild \
              -project Yuedu-Reader.xcodeproj \
              -scheme Yuedu-Reader \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "build-$name" \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
              SWIFT_COMPILATION_MODE="$mode" \
              SWIFT_OPTIMIZATION_LEVEL="$opt" \
              OTHER_SWIFTFLAGS="$extra_flags" \
              VALIDATE_PRODUCT=NO \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              build > "build-$name.log" 2>&1
          }

          # 返回 0=成功，1=编译器崩溃（可换档重试），2=真实源码错误（不该重试）
          attempt() {
            local name="$1" mode="$2" opt="$3" extra_flags="$4"
            if build_with "$name" "$mode" "$opt" "$extra_flags"; then
              echo "编译成功（$name）"
              echo "BUILD_DIR=build-$name" >> "$GITHUB_ENV"
              cp "build-$name.log" build.log
              tail -20 "build-$name.log"
              return 0
            fi
            echo "----- $name 失败，判断失败类型 -----"
            if [ "$(grep -c 'error:' "build-$name.log")" -gt 0 ]; then
              echo "===== 真实编译错误，停止换档 ====="
              grep -n 'error:' "build-$name.log" | head -60
              echo "===== 失败命令 ====="
              awk '/The following build commands failed:/,0' "build-$name.log" | head -30
              cp "build-$name.log" build.log
              return 2
            fi
            echo "===== 没有 error: 行，判定为编译器崩溃（IRGen/SIL） ====="
            grep -n -A3 'While emitting IR\|Stack dump\|PLEASE submit a bug report' "build-$name.log" | head -20
            return 1
          }

          # 调整降级策略：优先使用带有禁用 LLVM 优化特性的安全组合，直接避开崩溃点
          for combo in "Onone-safe|incremental|-Onone|-Xllvm -disable-llvm-optzns" "Onone|wholemodule|-Onone|" "O|wholemodule|-O|"; do
            IFS='|' read -r name mode opt extra_flags <<< "$combo"
            attempt "$name" "$mode" "$opt" "$extra_flags"
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ]; then exit 1; fi
          done

          echo "===== 全部组合均崩溃，附上最后一次日志 ====="
          cp build-Onone-safe.log build.log
          exit 1
