name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 支持两种放置方式：① 直接上传源码到仓库根目录；② 只上传一个 zip 包（手机端推荐）
      # 注意：仓库里必须只保留一个新 zip；多个 zip 时旧包会被误选，导致修复不生效
      - name: Extract source if uploaded as archive
        run: |
          if [ -f Yuedu-Reader.xcodeproj/project.pbxproj ]; then
            echo "源码已在根目录，无需解压"
            exit 0
          fi
          echo "=== 仓库里的 zip 文件 ==="
          ls -la *.zip 2>/dev/null || true
          ZIP_COUNT=$(ls -1 *.zip 2>/dev/null | wc -l | tr -d ' ')
          echo "zip 数量: $ZIP_COUNT"
          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "!! 检测到 $ZIP_COUNT 个 zip，可能混入了旧包"
          fi
          ARCHIVE=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "未找到源码或 zip 包"; ls -a; exit 1
          fi
          echo "解压 $ARCHIVE"
          mkdir -p _src && unzip -q "$ARCHIVE" -d _src
          ROOT=$(find _src -name "Yuedu-Reader.xcodeproj" -maxdepth 4 -type d | head -1 | xargs dirname)
          echo "SOURCE_ROOT=$ROOT"
          shopt -s dotglob
          cp -R "$ROOT"/* ./
          rm -rf _src "$ARCHIVE"
          ls -a | head -30

      # 关卡：确认解压出来的确实是最新的修复版源码，避免旧包白白编译十分钟
      - name: Verify source is the fixed version
        run: |
          MISSING=0
          check() {
            if grep -q "$2" "$1" 2>/dev/null; then
              echo "  OK   $3"
            else
              echo "  MISS $3   (文件: $1)"
              MISSING=$((MISSING+1))
            fi
          }
          echo "=== 校验修复是否包含在源码中 ==="
          check Modules/Core/MOBI/KF8Converter.swift 'let insertion: \[UInt8\]' "KF8Converter 类型检查拆分"
          check Modules/Core/ReaderCore/CoreText/HTMLAttributedStringBuilder.swift '@unchecked Sendable' "ElementNode Sendable"
          check Modules/Features/AI/AIRelationshipMapView.swift 'let step: Double' "AIRelationshipMapView 拆分"
          check Modules/Features/Explore/PublicLibrary/PublicLibraryBookSheet.swift 'let opacity: Double' "PublicLibrary 运算符拆分"
          check Modules/Features/Reader/ReaderViewportReporting.swift 'YUEDU_HAS_RESERVED_REGIONS' "ReservedRegion 隔离"
          check Modules/Services/Works/WorkIndexService.swift 'let seriesValue' "WorkIndex 类型标注"
          check Modules/Core/BookSource/SourcePerfTrace.swift 'thresholdMilliseconds: Int = 1' "spanAsync 阈值改 Int（绕开 IRGen 崩溃）"
          echo "缺失修复项: $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "!! 源码是旧版本，修复未生效 !!"
            echo "请：删除仓库中所有旧 zip，只保留最新的 Yuedu-reader-2.0-source.zip，再重跑"
            echo "当前仓库 zip："
            ls -la *.zip 2>/dev/null || echo "(无 zip，说明源码直接放在根目录且未更新)"
            exit 1
          fi
          echo "源码版本校验通过"

      # 工程用 Xcode 26 开发（LastUpgradeVersion 2650，用到 iOS 26 API），
      # 优先选 Xcode 26，没有再退回 16.4
      - name: Pick newest Xcode (26 preferred)
        run: |
          ls /Applications | grep -i xcode
          BEST=""
          BEST_V=0
          for x in /Applications/Xcode*.app; do
            v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            echo "found: $x ($v)"
            # 版本号转成可比较的数字：26.3 -> 2603, 16.4 -> 1604
            maj=${v%%.*}
            rest=${v#*.}
            min=${rest%%.*}
            n=$((maj * 100 + 10#${min:-0}))
            if [ "$n" -gt "$BEST_V" ]; then
              BEST_V=$n
              BEST="$x"
            fi
          done
          echo "选中 $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version
          echo "--- installed iOS SDKs ---"
          xcodebuild -showsdks | grep -i iphone

      - name: Generate placeholder GoogleService-Info.plist
        run: |
          if [ ! -s GoogleService-Info.plist ]; then
            cat > GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>BUNDLE_ID</key><string>com.yuedu.reader</string>
            <key>PROJECT_ID</key><string>yuedu-placeholder</string>
            <key>API_KEY</key><string>AIzaSyPLACEHOLDER-KEY-00000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>STORAGE_BUCKET</key><string>yuedu-placeholder.appspot.com</string>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          EOF
            echo "Placeholder written"
          fi

      - name: Show package layout
        run: |
          echo "=== Packages/ 目录 ==="
          ls -la Packages/ || true
          echo "=== 本地包定义 ==="
          cat Packages/SwiftSoup/Package.swift || true
          echo "=== 工程里的本地包引用 ==="
          grep -n 'XCLocalSwiftPackageReference' Yuedu-Reader.xcodeproj/project.pbxproj || true
          echo "=== Package.resolved 包数 ==="
          python3 -c "import json;d=json.load(open('Yuedu-Reader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'));print(len(d['pins']));print([i['identity'] for i in d['pins']])" || true

      # 依赖解析：工程自带 Package.resolved（27 个包锁定版本），
      # 先单独 resolve，失败时重试，避免网络抖动导致整个构建挂掉
      - name: Resolve Swift packages (with retry)
        run: |
          for i in 1 2 3; do
            echo "===== 依赖解析尝试 $i ====="
            if xcodebuild -resolvePackageDependencies \
                 -project Yuedu-Reader.xcodeproj \
                 -scheme Yuedu-Reader \
                 -derivedDataPath build \
                 -clonedSourcePackagesDirPath build/SourcePackages \
                 -skipPackagePluginValidation \
                 -skipMacroValidation \
                 > resolve.log 2>&1; then
              echo "依赖解析成功"
              exit 0
            fi
            echo "第 $i 次失败，尾部日志："
            tail -25 resolve.log
            sleep 15
          done
          echo "===== 依赖解析连续 3 次失败，完整错误 ====="
          grep -n 'error:' resolve.log | head -40
          echo "===== 全部冲突类错误 ====="
          grep -n -i 'conflict\|multiple packages\|unique across' resolve.log | head -30
          tail -60 resolve.log
          exit 1

      # 注意：不能用 tail 截断输出，否则报错行会被吞掉
      - name: Detect ReservedRegion support
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          if grep -rql 'ReservedRegion' "$SDK_PATH/System/Library/Frameworks/SwiftUI.framework" 2>/dev/null; then
            echo "SDK 支持 ReservedRegion，启用 iOS 27 能力"
            echo "EXTRA_SWIFT_FLAGS=-DYUEDU_HAS_RESERVED_REGIONS" >> "$GITHUB_ENV"
          else
            echo "SDK 不含 ReservedRegion，该项功能降级为空实现"
            echo "EXTRA_SWIFT_FLAGS=" >> "$GITHUB_ENV"
          fi
          # 编译器崩溃的根因已在源码中修掉（spanAsync 的阈值参数由 Double 改为 Int，
          # 不再生成会崩的那个 thunk），这里保留默认的 wholemodule 优化
          echo "COMPILATION_MODE=wholemodule" >> "$GITHUB_ENV"

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          echo "EXTRA_SWIFT_FLAGS=$EXTRA_SWIFT_FLAGS"
          echo "COMPILATION_MODE=$COMPILATION_MODE"

          # name 只用作日志/目录名，不带前导连字符，避免出现 build--O.log 这种双连字符
          build_with() {
            local name="$1" mode="$2" opt="$3"
            echo "----- 尝试组合: $name (mode=$mode opt=$opt) -----"
            xcodebuild \
              -project Yuedu-Reader.xcodeproj \
              -scheme Yuedu-Reader \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "build-$name" \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
              SWIFT_COMPILATION_MODE="$mode" \
              SWIFT_OPTIMIZATION_LEVEL="$opt" \
              VALIDATE_PRODUCT=NO \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              build > "build-$name.log" 2>&1
          }

          # 返回 0=成功，1=编译器崩溃（可换档重试），2=真实源码错误（不该重试）
          attempt() {
            local name="$1" mode="$2" opt="$3"
            if build_with "$name" "$mode" "$opt"; then
              echo "编译成功（$name）"
              echo "BUILD_DIR=build-$name" >> "$GITHUB_ENV"
              cp "build-$name.log" build.log
              tail -20 "build-$name.log"
              return 0
            fi
            echo "----- $name 失败，判断失败类型 -----"
            if [ "$(grep -c 'error:' "build-$name.log")" -gt 0 ]; then
              echo "===== 真实编译错误，停止换档 ====="
              grep -n 'error:' "build-$name.log" | head -60
              echo "===== 失败命令 ====="
              awk '/The following build commands failed:/,0' "build-$name.log" | head -30
              cp "build-$name.log" build.log
              return 2
            fi
            echo "===== 没有 error: 行，判定为编译器崩溃（IRGen/SIL） ====="
            grep -n -A3 'While emitting IR\|Stack dump\|PLEASE submit a bug report' "build-$name.log" | head -20
            return 1
          }

          # 正常路径：-O。若 swift-frontend 崩溃，依次退回 -Onone、-Onone+incremental
          for combo in "O|wholemodule|-O" "Onone|wholemodule|-Onone" "Onone-inc|incremental|-Onone"; do
            IFS='|' read -r name mode opt <<< "$combo"
            attempt "$name" "$mode" "$opt"
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ]; then exit 1; fi
          done

          echo "===== 三种组合全部崩溃，附上最后一次日志 ====="
          cp build-Onone-inc.log build.log
          exit 1

      - name: Package unsigned IPA
        run: |
          # 兜底：BUILD_DIR 为空时，在常见的构建目录里找
          if [ -z "$BUILD_DIR" ]; then
            for d in build-O build-Onone build-Onone-inc build; do
              if [ -d "$d/Build/Products" ]; then BUILD_DIR="$d"; break; fi
            done
          fi
          echo "使用构建目录: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR/Build/Products" ]; then
            echo "没有找到任何构建产物目录，列出当前目录："
            ls -la
            find . -maxdepth 2 -name "Products" -type d | head -20
            exit 1
          fi
          # 全深度搜索，避免目录层级变化导致漏掉
          APP=$(find "$BUILD_DIR/Build/Products" -name "*.app" -type d -maxdepth 3 | grep -v -E 'Tests|UITests|\.appex' | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app，列出产物目录："
            find "$BUILD_DIR/Build/Products" -maxdepth 3 | head -60
            exit 1
          fi
          echo "App bundle: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Yuedu-unsigned.ipa Payload
          ls -lh Yuedu-unsigned.ipa
          unzip -l Yuedu-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yuedu-unsigned-ipa
          path: Yuedu-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
