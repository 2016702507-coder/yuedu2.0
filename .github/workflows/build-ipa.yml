name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解压源码
      - name: Extract source if uploaded as archive
        run: |
          if [ -f Yuedu-Reader.xcodeproj/project.pbxproj ]; then
            echo "源码已在根目录，无需解压"
            exit 0
          fi
          echo "=== 仓库里的 zip 文件 ==="
          ls -la *.zip 2>/dev/null || true
          ARCHIVE=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "未找到源码或 zip 包"; ls -a; exit 1
          fi
          echo "解压 $ARCHIVE"
          mkdir -p _src && unzip -q "$ARCHIVE" -d _src
          ROOT=$(find _src -name "Yuedu-Reader.xcodeproj" -maxdepth 4 -type d | head -1 | xargs dirname)
          shopt -s dotglob
          cp -R "$ROOT"/* ./
          rm -rf _src "$ARCHIVE"

      # 校验源码修复补丁
      - name: Verify source is the fixed version
        run: |
          MISSING=0
          check() {
            if grep -q "$2" "$1" 2>/dev/null; then
              echo "  OK   $3"
            else
              echo "  MISS $3   (文件: $1)"
              MISSING=$((MISSING+1))
            fi
          }
          check_absent() {
            if grep -q "$2" "$1" 2>/dev/null; then
              echo "  BAD  $3   (文件: $1 仍含该写法)"
              MISSING=$((MISSING+1))
            else
              echo "  OK   $3"
            fi
          }
          echo "=== 校验修复是否包含在源码中 ==="
          check Modules/Core/MOBI/KF8Converter.swift 'let insertion: \[UInt8\]' "KF8Converter 类型检查拆分"
          check Modules/Core/ReaderCore/CoreText/HTMLAttributedStringBuilder.swift '@unchecked Sendable' "ElementNode Sendable"
          check Modules/Features/AI/AIRelationshipMapView.swift 'let step: Double' "AIRelationshipMapView 拆分"
          check Modules/Features/Explore/PublicLibrary/PublicLibraryBookSheet.swift 'let opacity: Double' "PublicLibrary 运算符拆分"
          check Modules/Features/Reader/ReaderViewportReporting.swift 'YUEDU_HAS_RESERVED_REGIONS' "ReservedRegion 隔离"
          check Modules/Services/Works/WorkIndexService.swift 'let seriesValue' "WorkIndex 类型标注"
          check Modules/Core/BookSource/SourcePerfTrace.swift 'thresholdMilliseconds: Int = 1' "spanAsync 阈值改 Int"
          check Modules/Features/Reader/ChapterTitleInspectorView.swift 'Binding<Double>(' "ChapterTitleInspectorView 内联 Binding"
          check_absent Modules/Features/Reader/ChapterTitleInspectorView.swift 'doubleBinding' "doubleBinding 已展开（消除 IRGen thunk）"
          echo "缺失修复项: $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo "!! 源码缺少必要补丁（可能上传了旧 zip）!!"
            exit 1
          fi
          echo "源码版本校验通过"

      # 选用最新 Xcode（工程用 Xcode 26 开发，需要 iOS 26 SDK）
      - name: Pick newest Xcode
        run: |
          BEST=""
          BEST_V=0
          for x in /Applications/Xcode*.app; do
            v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            maj=${v%%.*}
            rest=${v#*.}
            min=${rest%%.*}
            n=$((maj * 100 + 10#${min:-0}))
            if [ "$n" -gt "$BEST_V" ]; then
              BEST_V=$n
              BEST="$x"
            fi
          done
          echo "选中: $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Generate placeholder GoogleService-Info.plist
        run: |
          if [ ! -s GoogleService-Info.plist ]; then
            cat > GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>BUNDLE_ID</key><string>com.yuedu.reader</string>
            <key>PROJECT_ID</key><string>yuedu-placeholder</string>
            <key>API_KEY</key><string>AIzaSyPLACEHOLDER-KEY-00000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>STORAGE_BUCKET</key><string>yuedu-placeholder.appspot.com</string>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          EOF
            echo "已写入占位 GoogleService-Info.plist"
          fi

      - name: Resolve Swift packages (with retry)
        run: |
          for i in 1 2 3; do
            echo "===== 依赖解析尝试 $i ====="
            if xcodebuild -resolvePackageDependencies \
                 -project Yuedu-Reader.xcodeproj \
                 -scheme Yuedu-Reader \
                 -derivedDataPath build \
                 -clonedSourcePackagesDirPath build/SourcePackages \
                 -skipPackagePluginValidation \
                 -skipMacroValidation > resolve.log 2>&1; then
              echo "依赖解析成功"
              exit 0
            fi
            tail -20 resolve.log
            sleep 10
          done
          echo "===== 依赖解析失败 ====="
          grep -n 'error:' resolve.log | head -30
          tail -60 resolve.log
          exit 1

      - name: Detect ReservedRegion support
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          if grep -rql 'ReservedRegion' "$SDK_PATH/System/Library/Frameworks/SwiftUI.framework" 2>/dev/null; then
            echo "SDK 支持 ReservedRegion"
            echo "EXTRA_SWIFT_FLAGS=-DYUEDU_HAS_RESERVED_REGIONS" >> "$GITHUB_ENV"
          else
            echo "SDK 不含 ReservedRegion，对应功能降级"
            echo "EXTRA_SWIFT_FLAGS=" >> "$GITHUB_ENV"
          fi

      # 背景：Xcode 26.3 的 swift-frontend 在 IRGen 阶段发射
      #   "$sSdScA_pSgIeAghyg_SdIeAghn_TR"
      # （reabstraction thunk：(Double, Actor?) -> () 转 (Double) -> ()）
      # 时会 abort（SmallVector::grow_pod 超容量）。
      # 该 thunk 由 ChapterTitleInspectorView.swift 里把 @MainActor 闭包
      # 当作 (Double) -> Void 传入 Binding.init 触发，已在源码中展开为
      # 内联 Binding<Double>(get:set:) 消除。
      # 下面额外加一层保险：禁用 batch mode（每个文件独立前端进程），
      # 避免 batch 内跨文件 IRGen 状态累积；并降低并行度、崩溃时重试。
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          echo "EXTRA_SWIFT_FLAGS=$EXTRA_SWIFT_FLAGS"
          echo "Xcode: $(xcodebuild -version | head -1)"

          build_with() {
            local name="$1" mode="$2" opt="$3" batch="$4"
            echo "----- 尝试配置: $name (mode=$mode opt=$opt batch=$batch) -----"
            xcodebuild \
              -project Yuedu-Reader.xcodeproj \
              -scheme Yuedu-Reader \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "build-$name" \
              -jobs 4 \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
              SWIFT_COMPILATION_MODE="$mode" \
              SWIFT_OPTIMIZATION_LEVEL="$opt" \
              SWIFT_ENABLE_BATCH_MODE="$batch" \
              OTHER_SWIFT_FLAGS="\$(inherited) -Xfrontend -disable-llvm-optzns" \
              VALIDATE_PRODUCT=NO \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              build > "build-$name.log" 2>&1
          }

          # 返回 0=成功 1=编译器崩溃（可重试/换档） 2=真实源码错误（立即停）
          attempt() {
            local name="$1" mode="$2" opt="$3" batch="$4"
            if build_with "$name" "$mode" "$opt" "$batch"; then
              echo "编译成功（$name）"
              echo "BUILD_DIR=build-$name" >> "$GITHUB_ENV"
              cp "build-$name.log" build.log
              tail -20 "build-$name.log"
              return 0
            fi
            echo "----- $name 失败 -----"
            if [ "$(grep -c 'error:' "build-$name.log")" -gt 0 ]; then
              echo "===== 存在 error: 行，判定为真实源码错误，停止换档 ====="
              grep -n 'error:' "build-$name.log" | head -60
              echo "===== 失败命令 ====="
              awk '/The following build commands failed:/,0' "build-$name.log" | head -25
              cp "build-$name.log" build.log
              return 2
            fi
            echo "===== 无 error: 行，判定为编译器崩溃 ====="
            grep -n 'While evaluating request IRGenRequest\|While emitting IR SIL function\|Stack dump\|PLEASE submit a bug report' "build-$name.log" | head -12
            cp "build-$name.log" build.log
            return 1
          }

          for combo in "nobatch-a|incremental|-Onone|NO" "nobatch-b|incremental|-Onone|NO" "batch|incremental|-Onone|YES"; do
            IFS='|' read -r name mode opt batch <<< "$combo"
            attempt "$name" "$mode" "$opt" "$batch"
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ]; then exit 1; fi
            echo "该档编译器崩溃，进入下一档"
          done

          echo "===== 三种配置均崩溃，请查看上方崩溃文件 ====="
          exit 1

      - name: Package unsigned IPA
        run: |
          if [ -z "$BUILD_DIR" ]; then
            for d in build-nobatch-a build-nobatch-b build-batch build-out; do
              if [ -d "$d/Build/Products" ]; then BUILD_DIR="$d"; break; fi
            done
          fi
          echo "使用构建目录: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR/Build/Products" ]; then
            echo "未找到构建产物目录，列出当前目录："
            ls -la
            find . -maxdepth 2 -name "Products" -type d | head -20
            exit 1
          fi
          APP=$(find "$BUILD_DIR/Build/Products" -name "*.app" -type d -maxdepth 3 | grep -v -E 'Tests|UITests|\.appex' | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 目录"
            find "$BUILD_DIR/Build/Products" -maxdepth 3 | head -60
            exit 1
          fi
          echo "找到 APP Bundle: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Yuedu-unsigned.ipa Payload
          ls -lh Yuedu-unsigned.ipa
          unzip -l Yuedu-unsigned.ipa | head -15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yuedu-unsigned-ipa
          path: Yuedu-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
