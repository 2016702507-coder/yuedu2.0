name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source if uploaded as archive
        run: |
          if [ -f Yuedu-Reader.xcodeproj/project.pbxproj ]; then
            echo "源码已在根目录，无需解压"
            exit 0
          fi
          echo "=== 仓库里的 zip 文件 ==="
          ls -la *.zip 2>/dev/null || true
          ZIP_COUNT=$(ls -1 *.zip 2>/dev/null | wc -l | tr -d ' ')
          echo "zip 数量: $ZIP_COUNT"
          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "!! 检测到 $ZIP_COUNT 个 zip，可能混入了旧包"
          fi
          ARCHIVE=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "未找到源码或 zip 包"; ls -a; exit 1
          fi
          echo "解压 $ARCHIVE"
          mkdir -p _src && unzip -q "$ARCHIVE" -d _src
          ROOT=$(find _src -name "Yuedu-Reader.xcodeproj" -maxdepth 4 -type d | head -1 | xargs dirname)
          echo "SOURCE_ROOT=$ROOT"
          shopt -s dotglob
          cp -R "$ROOT"/* ./
          rm -rf _src "$ARCHIVE"
          ls -a | head -30

      - name: Verify source is the fixed version
        run: |
          MISSING=0
          check() {
            if grep -q "$2" "$1" 2>/dev/null; then
              echo "  OK   $3"
            else
              echo "  MISS $3   (文件: $1)"
              MISSING=$((MISSING+1))
            fi
          }
          echo "=== 校验修复是否包含在源码中 ==="
          check Modules/Core/MOBI/KF8Converter.swift 'let insertion: \[UInt8\]' "KF8Converter 类型检查拆分"
          check Modules/Core/ReaderCore/CoreText/HTMLAttributedStringBuilder.swift '@unchecked Sendable' "ElementNode Sendable"
          check Modules/Features/AI/AIRelationshipMapView.swift 'let step: Double' "AIRelationshipMapView 拆分"
          check Modules/Features/Explore/PublicLibrary/PublicLibraryBookSheet.swift 'let opacity: Double' "PublicLibrary 运算符拆分"
          check Modules/Features/Reader/ReaderViewportReporting.swift 'YUEDU_HAS_RESERVED_REGIONS' "ReservedRegion 隔离"
          check Modules/Services/Works/WorkIndexService.swift 'let seriesValue' "WorkIndex 类型标注"
          echo "缺失修复项: $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "!! 源码是旧版本，修复未生效 !!"
            echo "请：删除仓库中所有旧 zip，只保留最新的 Yuedu-reader-2.0-source.zip，再重跑"
            echo "当前仓库 zip："
            ls -la *.zip 2>/dev/null || echo "(无 zip，说明源码直接放在根目录且未更新)"
            exit 1
          fi
          echo "源码版本校验通过"

      - name: Pick newest Xcode (26 preferred)
        run: |
          ls /Applications | grep -i xcode
          BEST=""
          BEST_V=0
          for x in /Applications/Xcode*.app; do
            v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            echo "found: $x ($v)"
            maj=${v%%.*}
            rest=${v#*.}
            min=${rest%%.*}
            n=$((maj * 100 + 10#${min:-0}))
            if [ "$n" -gt "$BEST_V" ]; then
              BEST_V=$n
              BEST="$x"
            fi
          done
          echo "选中 $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version
          echo "--- installed iOS SDKs ---"
          xcodebuild -showsdks | grep -i iphone

      - name: Generate placeholder GoogleService-Info.plist
        run: |
          if [ ! -s GoogleService-Info.plist ]; then
            cat > GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>BUNDLE_ID</key><string>com.yuedu.reader</string>
            <key>PROJECT_ID</key><string>yuedu-placeholder</string>
            <key>API_KEY</key><string>AIzaSyPLACEHOLDER-KEY-00000000000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>STORAGE_BUCKET</key><string>yuedu-placeholder.appspot.com</string>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          EOF
            echo "Placeholder written"
          fi

      - name: Show package layout
        run: |
          echo "=== Packages/ 目录 ==="
          ls -la Packages/ || true
          echo "=== 本地包定义 ==="
          cat Packages/SwiftSoup/Package.swift || true
          echo "=== 工程里的本地包引用 ==="
          grep -n 'XCLocalSwiftPackageReference' Yuedu-Reader.xcodeproj/project.pbxproj || true
          echo "=== Package.resolved 包数 ==="
          python3 -c "import json;d=json.load(open('Yuedu-Reader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'));print(len(d['pins']));print([i['identity'] for i in d['pins']])" || true

      - name: Resolve Swift packages (with retry)
        run: |
          for i in 1 2 3; do
            echo "===== 依赖解析尝试 $i ====="
            if xcodebuild -resolvePackageDependencies \
                 -project Yuedu-Reader.xcodeproj \
                 -scheme Yuedu-Reader \
                 -derivedDataPath build \
                 -clonedSourcePackagesDirPath build/SourcePackages \
                 -skipPackagePluginValidation \
                 -skipMacroValidation \
                 > resolve.log 2>&1; then
              echo "依赖解析成功"
              exit 0
            fi
            echo "第 $i 次失败，尾部日志："
            tail -25 resolve.log
            sleep 15
          done
          echo "===== 依赖解析连续 3 次失败，完整错误 ====="
          grep -n 'error:' resolve.log | head -40
          echo "===== 全部冲突类错误 ====="
          grep -n -i 'conflict\|multiple packages\|unique across' resolve.log | head -30
          tail -60 resolve.log
          exit 1

      - name: Detect ReservedRegion support
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          if grep -rql 'ReservedRegion' "$SDK_PATH/System/Library/Frameworks/SwiftUI.framework" 2>/dev/null; then
            echo "SDK 支持 ReservedRegion，启用 iOS 27 能力"
            echo "EXTRA_SWIFT_FLAGS=-DYUEDU_HAS_RESERVED_REGIONS" >> "$GITHUB_ENV"
          else
            echo "SDK 不含 ReservedRegion，该项功能降级为空实现"
            echo "EXTRA_SWIFT_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          echo "EXTRA_SWIFT_FLAGS=$EXTRA_SWIFT_FLAGS"
          xcodebuild \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build > build.log 2>&1 || {
              echo "===== 编译失败，错误摘要如下 ====="
              grep -n 'error:' build.log | head -60
              echo "===== 失败命令 ====="
              awk '/The following build commands failed:/,0' build.log | head -30
              exit 1
            }
          tail -20 build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | grep -v -E 'Tests|UITests' | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app，列出产物目录："
            find build/Build/Products -maxdepth 2 | head -50
            exit 1
          fi
          echo "App bundle: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Yuedu-unsigned.ipa Payload
          ls -lh Yuedu-unsigned.ipa
          unzip -l Yuedu-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yuedu-unsigned-ipa
          path: Yuedu-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
